<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>J.A.R.V.I.S.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #04080f;
    --bg-2: #07111d;
    --panel: rgba(10, 24, 38, 0.62);
    --panel-solid: #0a1826;
    --line: rgba(88, 214, 255, 0.16);
    --line-strong: rgba(88, 214, 255, 0.38);
    --cyan: #3ee6ff;
    --cyan-soft: rgba(62, 230, 255, 0.12);
    --amber: #ffb547;
    --red: #ff5d6c;
    --text: #d9f4ff;
    --text-dim: #7fa3b8;
    --text-faint: #4d6a7d;
    --accent: var(--cyan);
    --hud: "Orbitron", "Segoe UI", sans-serif;
    --body: "Inter", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(1200px 700px at 30% 45%, rgba(20, 90, 130, 0.22), transparent 60%),
      radial-gradient(900px 600px at 90% 10%, rgba(40, 60, 140, 0.18), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: var(--body);
    font-size: 14px;
    overflow: hidden;
    user-select: none;
    display: flex;
    flex-direction: column;
  }
  /* faint HUD grid */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(88, 214, 255, 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(88, 214, 255, 0.035) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(ellipse at 35% 50%, black 20%, transparent 75%);
    pointer-events: none;
  }

  /* ---------- title bar ---------- */
  .titlebar {
    position: relative;
    height: 52px;
    display: flex; align-items: center; gap: 16px;
    padding: 0 8px 0 20px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(8, 20, 32, 0.9), rgba(8, 20, 32, 0.4));
    flex-shrink: 0;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark {
    width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid var(--cyan);
    box-shadow: 0 0 12px rgba(62, 230, 255, 0.6), inset 0 0 8px rgba(62, 230, 255, 0.6);
    display: grid; place-items: center;
  }
  .brand-mark::after {
    content: ""; width: 8px; height: 8px; border-radius: 50%;
    background: #e9fdff; box-shadow: 0 0 10px var(--cyan);
  }
  .brand-name { font-family: var(--hud); font-weight: 700; letter-spacing: 0.32em; font-size: 15px; }
  .brand-sub { font-size: 11px; color: var(--text-faint); letter-spacing: 0.06em; }
  .pill {
    margin-left: 8px;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 5px 12px; border-radius: 99px;
    border: 1px solid var(--line); background: rgba(10, 24, 38, 0.6);
    font-family: var(--hud); font-size: 10px; letter-spacing: 0.2em; color: var(--text-dim);
  }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-faint); }
  .pill.online { color: var(--cyan); border-color: var(--line-strong); }
  .pill.online .dot { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); animation: blink 1.6s infinite; }
  @keyframes blink { 50% { opacity: 0.35; } }
  .spacer { flex: 1; }
  .clock { text-align: right; line-height: 1.2; margin-right: 10px; }
  .clock-time { font-family: var(--hud); font-size: 14px; letter-spacing: 0.12em; }
  .clock-date { font-size: 11px; color: var(--text-faint); }
  .win-btns { display: flex; gap: 2px; }
  .win-btn {
    width: 38px; height: 32px; border: 0; border-radius: 6px; background: transparent;
    color: var(--text-dim); display: grid; place-items: center; cursor: pointer;
  }
  .win-btn:hover { background: rgba(88, 214, 255, 0.1); color: var(--text); }
  .win-btn.close:hover { background: rgba(255, 93, 108, 0.85); color: #fff; }
  .win-btn svg { width: 14px; height: 14px; }

  /* ---------- layout ---------- */
  main {
    flex: 1; min-height: 0;
    display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(360px, 1fr);
    gap: 18px; padding: 18px;
  }
  .panel {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    backdrop-filter: blur(6px);
    min-height: 0;
  }
  /* HUD corner brackets */
  .panel::before, .panel::after {
    content: ""; position: absolute; width: 18px; height: 18px; pointer-events: none;
    border-color: var(--line-strong); border-style: solid;
  }
  .panel::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; border-top-left-radius: 14px; }
  .panel::after { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; border-bottom-right-radius: 14px; }

  /* ---------- core stage ---------- */
  .stage { display: flex; flex-direction: column; align-items: center; padding: 18px 24px 22px; }
  .core-wrap { position: relative; flex: 1; width: 100%; min-height: 240px; }
  #core { position: absolute; inset: 0; width: 100%; height: 100%; }
  .state-label {
    font-family: var(--hud); font-weight: 700; font-size: 20px; letter-spacing: 0.28em;
    color: var(--accent); text-shadow: 0 0 18px color-mix(in srgb, var(--accent) 55%, transparent);
    margin-top: 6px; transition: color 0.4s;
  }
  .state-sub { color: var(--text-dim); margin-top: 6px; min-height: 20px; }
  .activate {
    margin-top: 18px;
    display: inline-flex; align-items: center; gap: 10px;
    padding: 13px 30px; border-radius: 99px; cursor: pointer;
    font-family: var(--hud); font-size: 12px; font-weight: 700; letter-spacing: 0.22em;
    color: #02141c; background: linear-gradient(90deg, #3ee6ff, #7cf3ff);
    border: 0; box-shadow: 0 0 24px rgba(62, 230, 255, 0.45);
    transition: transform 0.15s, box-shadow 0.2s, background 0.3s, color 0.3s;
  }
  .activate:hover { transform: translateY(-1px); box-shadow: 0 0 34px rgba(62, 230, 255, 0.65); }
  .activate svg { width: 16px; height: 16px; }
  .activate.running {
    background: rgba(255, 93, 108, 0.08); color: var(--red);
    box-shadow: inset 0 0 0 1.5px var(--red), 0 0 22px rgba(255, 93, 108, 0.25);
  }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 18px; }
  .chip {
    padding: 7px 14px; border-radius: 99px; cursor: pointer;
    border: 1px solid var(--line); background: rgba(62, 230, 255, 0.04);
    color: var(--text-dim); font: 500 12.5px var(--body);
    transition: all 0.15s;
  }
  .chip:hover { border-color: var(--line-strong); color: var(--text); background: var(--cyan-soft); }

  /* ---------- conversation ---------- */
  .chat { display: flex; flex-direction: column; }
  .chat-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px 12px 20px; border-bottom: 1px solid var(--line);
  }
  .chat-title { font-family: var(--hud); font-size: 11px; letter-spacing: 0.26em; color: var(--text-dim); }
  .icon-btn {
    border: 0; background: transparent; color: var(--text-faint); cursor: pointer;
    width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center;
  }
  .icon-btn:hover { color: var(--text); background: rgba(88, 214, 255, 0.08); }
  .icon-btn svg { width: 15px; height: 15px; }
  .messages {
    flex: 1; overflow-y: auto; padding: 18px 18px 8px;
    display: flex; flex-direction: column; gap: 14px;
    user-select: text;
  }
  .messages::-webkit-scrollbar { width: 8px; }
  .messages::-webkit-scrollbar-thumb { background: rgba(88, 214, 255, 0.15); border-radius: 8px; }
  .empty {
    margin: auto; text-align: center; color: var(--text-faint); max-width: 260px; line-height: 1.6;
  }
  .empty b { display: block; font-family: var(--hud); font-size: 12px; letter-spacing: 0.2em; color: var(--text-dim); margin-bottom: 6px; }
  .msg { display: flex; gap: 10px; max-width: 88%; animation: rise 0.25s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  .msg .avatar {
    flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%;
    border: 1.5px solid var(--cyan); display: grid; place-items: center;
    box-shadow: 0 0 10px rgba(62, 230, 255, 0.35);
    font-family: var(--hud); font-size: 11px; font-weight: 700; color: var(--cyan);
  }
  .msg .bubble { padding: 10px 14px; border-radius: 14px; line-height: 1.55; }
  .msg .meta { font-size: 10.5px; color: var(--text-faint); margin-top: 4px; }
  .msg.jarvis .bubble { background: rgba(62, 230, 255, 0.07); border: 1px solid var(--line); border-top-left-radius: 4px; }
  .msg.you { align-self: flex-end; flex-direction: row-reverse; }
  .msg.you .bubble {
    background: linear-gradient(135deg, rgba(62, 130, 255, 0.28), rgba(62, 230, 255, 0.18));
    border: 1px solid rgba(110, 170, 255, 0.3); border-top-right-radius: 4px;
  }
  .msg.you .meta { text-align: right; }
  .msg.you .avatar { border-color: #6ea8ff; color: #9cc3ff; box-shadow: none; }
  .msg.system {
    align-self: center; max-width: 92%;
    font-size: 12px; color: var(--text-dim); text-align: center;
    padding: 6px 12px; border-radius: 8px; border: 1px dashed var(--line);
  }
  .msg.system.warn { color: var(--amber); border-color: rgba(255, 181, 71, 0.35); }
  .typing { display: none; }
  .typing.show { display: flex; }
  .typing .bubble { display: flex; gap: 5px; align-items: center; padding: 14px 16px; }
  .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--amber); animation: bounce 1s infinite; }
  .typing i:nth-child(2) { animation-delay: 0.15s; }
  .typing i:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%, 80%, 100% { opacity: 0.3; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-4px); } }
  .composer {
    display: flex; gap: 8px; align-items: center;
    margin: 10px 14px 14px; padding: 6px 6px 6px 16px;
    border: 1px solid var(--line); border-radius: 12px; background: rgba(4, 12, 20, 0.7);
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .composer:focus-within { border-color: var(--line-strong); box-shadow: 0 0 0 3px rgba(62, 230, 255, 0.08); }
  .composer input {
    flex: 1; background: transparent; border: 0; outline: 0;
    color: var(--text); font: 14px var(--body);
  }
  .composer input::placeholder { color: var(--text-faint); }
  .send {
    width: 36px; height: 36px; border: 0; border-radius: 9px; cursor: pointer;
    background: var(--cyan); color: #02141c; display: grid; place-items: center;
    transition: opacity 0.2s, transform 0.15s;
  }
  .send:disabled { opacity: 0.25; cursor: default; }
  .send:not(:disabled):hover { transform: scale(1.05); }
  .send svg { width: 16px; height: 16px; }

  /* ---------- footer ---------- */
  footer {
    display: flex; gap: 22px; align-items: center;
    padding: 0 20px 12px; font-size: 11.5px; color: var(--text-faint); flex-shrink: 0;
  }
  footer span b { color: var(--text-dim); font-weight: 500; }
  footer .kbd { margin-left: auto; }
  kbd {
    font: 10.5px var(--body); padding: 1px 6px; border-radius: 4px;
    border: 1px solid var(--line); color: var(--text-dim);
  }

  @media (max-width: 860px) {
    main { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
    .core-wrap { min-height: 200px; height: 200px; flex: none; }
    .chips { display: none; }
    .brand-sub, .clock, footer .kbd { display: none; }
  }
</style>
</head>
<body>
  <header class="titlebar pywebview-drag-region">
    <div class="brand">
      <div class="brand-mark"></div>
      <div>
        <div class="brand-name">J.A.R.V.I.S.</div>
        <div class="brand-sub">Just A Rather Very Intelligent System</div>
      </div>
    </div>
    <div class="pill" id="pill"><span class="dot"></span><span id="pill-text">STANDBY</span></div>
    <div class="spacer"></div>
    <div class="clock">
      <div class="clock-time" id="clock-time">--:--</div>
      <div class="clock-date" id="clock-date"></div>
    </div>
    <div class="win-btns">
      <button class="win-btn" title="Minimize" onclick="api('minimize')">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 8h10"/></svg>
      </button>
      <button class="win-btn" title="Maximize" onclick="api('toggle_maximize')">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="10" height="10" rx="1.5"/></svg>
      </button>
      <button class="win-btn close" title="Close" onclick="api('close')">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4l8 8M12 4l-8 8"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section class="panel stage">
      <div class="core-wrap"><canvas id="core"></canvas></div>
      <div class="state-label" id="state-label">STANDBY</div>
      <div class="state-sub" id="state-sub">Activate me, or type a command</div>
      <button class="activate" id="activate" onclick="toggleJarvis()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        <span id="activate-text">ACTIVATE</span>
      </button>
      <div class="chips">
        <button class="chip" onclick="sendText(this.textContent)">Read the news</button>
        <button class="chip" onclick="sendText(this.textContent)">Play Believer</button>
        <button class="chip" onclick="sendText(this.textContent)">Open YouTube</button>
        <button class="chip" onclick="sendText(this.textContent)">Tell me a fun fact</button>
      </div>
    </section>

    <section class="panel chat">
      <div class="chat-head">
        <div class="chat-title">CONVERSATION</div>
        <button class="icon-btn" title="Clear conversation" onclick="clearChat()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>
        </button>
      </div>
      <div class="messages" id="messages">
        <div class="empty" id="empty"><b>ALL SYSTEMS READY</b>Say "Hey Jarvis" once activated, or type a command below.</div>
        <div class="msg jarvis typing" id="typing">
          <div class="avatar">J</div>
          <div class="bubble"><i></i><i></i><i></i></div>
        </div>
      </div>
      <form class="composer" onsubmit="event.preventDefault(); sendText(input.value)">
        <input id="input" placeholder="Type a command…  e.g. open notepad" autocomplete="off">
        <button class="send" id="send" type="submit" title="Send" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </form>
    </section>
  </main>

  <footer>
    <span>AI <b id="ai-info">—</b></span>
    <span>Voice <b>Google Speech</b></span>
    <span class="kbd"><kbd>Ctrl</kbd> + <kbd>J</kbd> activate / deactivate</span>
  </footer>

<script>
  const $ = (id) => document.getElementById(id);
  const input = $("input");
  let running = false;
  let status = "idle";

  // ---------- bridge to Python ----------
  function api(method, ...args) {
    const bridge = window.pywebview && window.pywebview.api;
    if (bridge && bridge[method]) return bridge[method](...args);
    return Promise.resolve(null);
  }

  // Called from Python with one event object at a time.
  window.jarvisUI = {
    handle(evt) {
      if (evt.type === "log") addMessage(evt.speaker, evt.text);
      else if (evt.type === "status") setStatus(evt.status);
      else if (evt.type === "running") setRunning(evt.value);
    },
  };

  // ---------- state ----------
  const STATES = {
    idle:      { label: "STANDBY",     sub: "Activate me, or type a command",  color: "#6f9bb8", pill: "STANDBY" },
    listening: { label: "LISTENING",   sub: 'Say "Jarvis" to wake me',          color: "#3ee6ff", pill: "ONLINE" },
    awake:     { label: "I'M LISTENING", sub: "Go ahead — what do you need?",   color: "#9bf6ff", pill: "ONLINE" },
    thinking:  { label: "PROCESSING",  sub: "Working on it…",                   color: "#ffb547", pill: "ONLINE" },
    speaking:  { label: "SPEAKING",    sub: "",                                  color: "#3ee6ff", pill: "ONLINE" },
  };

  function setStatus(s) {
    if (s === "ready") s = running ? "listening" : "idle";
    if (!running && (s === "listening" || s === "awake")) s = "idle";
    status = s;
    const st = STATES[s];
    $("state-label").textContent = st.label;
    $("state-sub").textContent = st.sub;
    document.documentElement.style.setProperty("--accent", st.color);
    $("typing").classList.toggle("show", s === "thinking");
    if (s === "thinking") scrollChat();
    core.setState(s);
    updatePill();
  }

  function setRunning(value) {
    running = value;
    $("activate").classList.toggle("running", running);
    $("activate-text").textContent = running ? "DEACTIVATE" : "ACTIVATE";
    setStatus(running ? "listening" : (status === "speaking" ? "speaking" : "idle"));
  }

  function updatePill() {
    $("pill").classList.toggle("online", running);
    $("pill-text").textContent = running ? "ONLINE" : "STANDBY";
  }

  function toggleJarvis() { api("toggle"); }

  function sendText(text) {
    text = (text || "").trim();
    if (!text) return;
    input.value = "";
    $("send").disabled = true;
    api("send_command", text);
  }

  input.addEventListener("input", () => { $("send").disabled = !input.value.trim(); });
  document.addEventListener("keydown", (e) => {
    if (e.ctrlKey && e.key.toLowerCase() === "j") { e.preventDefault(); toggleJarvis(); }
    else if (e.key.length === 1 && !e.ctrlKey && !e.altKey && document.activeElement !== input) input.focus();
  });

  // ---------- conversation ----------
  function scrollChat() {
    const m = $("messages");
    m.scrollTop = m.scrollHeight;
  }

  function addMessage(speaker, text) {
    $("empty").style.display = "none";
    const el = document.createElement("div");
    const time = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    if (speaker === "System") {
      el.className = "msg system" + (/^No |not |couldn't|error/i.test(text) ? " warn" : "");
      el.textContent = text;
    } else {
      const who = speaker === "You" ? "you" : "jarvis";
      el.className = "msg " + who;
      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = who === "you" ? "Y" : "J";
      const body = document.createElement("div");
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = (who === "you" ? "You" : "Jarvis") + " · " + time;
      body.append(bubble, meta);
      el.append(avatar, body);
    }
    $("messages").insertBefore(el, $("typing"));
    scrollChat();
  }

  function clearChat() {
    document.querySelectorAll("#messages .msg:not(.typing)").forEach((el) => el.remove());
    $("empty").style.display = "";
  }

  // ---------- clock ----------
  function tickClock() {
    const now = new Date();
    $("clock-time").textContent = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    $("clock-date").textContent = now.toLocaleDateString([], { weekday: "long", day: "numeric", month: "short" });
  }
  tickClock();
  setInterval(tickClock, 10000);

  // ---------- animated core ----------
  const core = (() => {
    const canvas = $("core");
    const ctx = canvas.getContext("2d");
    const TARGETS = {
      idle:      { rgb: [111, 155, 184], glow: 0.35, speed: 0.12, bars: 0.015, pulse: 0.02, orbit: 0 },
      listening: { rgb: [62, 230, 255],  glow: 0.8,  speed: 0.35, bars: 0.04,  pulse: 0.05, orbit: 0 },
      awake:     { rgb: [155, 246, 255], glow: 1.0,  speed: 0.8,  bars: 0.09,  pulse: 0.09, orbit: 0 },
      thinking:  { rgb: [255, 181, 71],  glow: 0.9,  speed: 2.0,  bars: 0.02,  pulse: 0.04, orbit: 1 },
      speaking:  { rgb: [62, 230, 255],  glow: 1.0,  speed: 0.55, bars: 0.2,   pulse: 0.1,  orbit: 0 },
    };
    const cur = { ...TARGETS.idle, rgb: [...TARGETS.idle.rgb] };
    let target = TARGETS.idle;
    let rot = 0, last = performance.now();

    function resize() {
      const r = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, r.width * dpr);
      canvas.height = Math.max(1, r.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener("resize", resize);
    resize();

    const lerp = (a, b, k) => a + (b - a) * k;
    const rgba = (a) => `rgba(${cur.rgb.map(Math.round).join(",")},${a})`;

    function arc(r, a0, a1, width, alpha) {
      ctx.beginPath();
      ctx.arc(0, 0, r, a0, a1);
      ctx.lineWidth = width;
      ctx.strokeStyle = rgba(alpha);
      ctx.stroke();
    }

    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      const t = now / 1000;
      const k = 1 - Math.pow(0.02, dt);  // smooth easing toward the target state
      for (const key of ["glow", "speed", "bars", "pulse", "orbit"]) cur[key] = lerp(cur[key], target[key], k);
      cur.rgb = cur.rgb.map((c, i) => lerp(c, target.rgb[i], k));
      rot += cur.speed * dt;

      const w = canvas.clientWidth, h = canvas.clientHeight;
      const R = Math.min(w, h) * 0.44;
      ctx.clearRect(0, 0, w, h);
      ctx.save();
      ctx.translate(w / 2, h / 2);
      ctx.globalCompositeOperation = "lighter";

      // ambient glow
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, R * 1.25);
      g.addColorStop(0, rgba(0.22 * cur.glow));
      g.addColorStop(1, rgba(0));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 0, R * 1.25, 0, Math.PI * 2); ctx.fill();

      // outer tick ring
      ctx.save();
      ctx.rotate(rot * 0.25);
      for (let i = 0; i < 120; i++) {
        const long = i % 10 === 0;
        const a = (i / 120) * Math.PI * 2;
        const r0 = R * (long ? 0.935 : 0.955);
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * r0, Math.sin(a) * r0);
        ctx.lineTo(Math.cos(a) * R, Math.sin(a) * R);
        ctx.lineWidth = long ? 2 : 1;
        ctx.strokeStyle = rgba(long ? 0.55 : 0.22);
        ctx.stroke();
      }
      ctx.restore();

      // segmented arcs, counter-rotating
      ctx.save();
      ctx.rotate(-rot * 0.6);
      ctx.shadowColor = rgba(0.9); ctx.shadowBlur = 12 * cur.glow;
      for (let i = 0; i < 4; i++) {
        const a0 = (i / 4) * Math.PI * 2;
        arc(R * 0.86, a0, a0 + Math.PI * 0.36, 3, 0.75);
        arc(R * 0.86, a0 + Math.PI * 0.4, a0 + Math.PI * 0.44, 3, 0.4);
      }
      ctx.restore();
      ctx.save();
      ctx.rotate(rot * 0.9);
      for (let i = 0; i < 3; i++) {
        const a0 = (i / 3) * Math.PI * 2;
        arc(R * 0.8, a0, a0 + Math.PI * 0.18, 1.5, 0.5);
      }
      ctx.restore();
      arc(R * 0.76, 0, Math.PI * 2, 1, 0.18);

      // orbiting dots while thinking
      if (cur.orbit > 0.02) {
        for (let i = 0; i < 3; i++) {
          const a = rot * 2.2 + (i / 3) * Math.PI * 2;
          ctx.beginPath();
          ctx.arc(Math.cos(a) * R * 0.76, Math.sin(a) * R * 0.76, 3.5, 0, Math.PI * 2);
          ctx.fillStyle = rgba(0.95 * cur.orbit);
          ctx.shadowColor = rgba(1); ctx.shadowBlur = 14;
          ctx.fill();
        }
        ctx.shadowBlur = 0;
      }

      // audio-style bars around the core
      const bars = 72;
      ctx.save();
      ctx.rotate(-rot * 0.15);
      for (let i = 0; i < bars; i++) {
        const a = (i / bars) * Math.PI * 2;
        const n = (Math.sin(t * 6.1 + i * 0.9) + Math.sin(t * 3.7 + i * 2.3) + Math.sin(t * 9.3 + i * 0.37)) / 3;
        const len = R * (0.02 + cur.bars * (0.5 + 0.5 * n));
        const r0 = R * 0.6;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * r0, Math.sin(a) * r0);
        ctx.lineTo(Math.cos(a) * (r0 + len), Math.sin(a) * (r0 + len));
        ctx.lineWidth = 2;
        ctx.lineCap = "round";
        ctx.strokeStyle = rgba(0.35 + 0.4 * cur.glow);
        ctx.stroke();
      }
      ctx.restore();

      // arc-reactor coil segments
      ctx.save();
      ctx.rotate(rot * 0.1);
      ctx.shadowColor = rgba(0.8); ctx.shadowBlur = 10 * cur.glow;
      for (let i = 0; i < 10; i++) {
        const a0 = (i / 10) * Math.PI * 2 + 0.06;
        arc(R * 0.47, a0, a0 + (Math.PI * 2) / 10 - 0.12, R * 0.07, 0.28 + 0.25 * cur.glow);
      }
      ctx.restore();
      arc(R * 0.395, 0, Math.PI * 2, 1.5, 0.6);

      // glowing core
      const pulse = 1 + cur.pulse * Math.sin(t * (status === "speaking" ? 9 : 2.4));
      const cr = R * 0.33 * pulse;
      const cg = ctx.createRadialGradient(0, 0, 0, 0, 0, cr);
      cg.addColorStop(0, "rgba(255,255,255,0.95)");
      cg.addColorStop(0.25, rgba(0.85));
      cg.addColorStop(0.6, rgba(0.25 * cur.glow + 0.08));
      cg.addColorStop(1, rgba(0));
      ctx.fillStyle = cg;
      ctx.beginPath(); ctx.arc(0, 0, cr, 0, Math.PI * 2); ctx.fill();

      ctx.restore();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    return { setState(s) { target = TARGETS[s] || TARGETS.idle; } };
  })();

  // ---------- startup ----------
  async function init() {
    const state = await api("get_state");
    if (!state) return;
    $("ai-info").textContent = state.ai;
    (state.messages || []).forEach((m) => addMessage(m[0], m[1]));
    setRunning(state.running);
  }
  window.addEventListener("pywebviewready", init);

  // Preview in a normal browser with ?demo (no Python needed).
  if (new URLSearchParams(location.search).has("demo")) {
    window.pywebview = { api: {
      get_state: async () => ({ ai: "Groq · openai/gpt-oss-20b · web search", running: false, messages: [] }),
      toggle: async () => jarvisUI.handle({ type: "running", value: !running }),
      send_command: async (text) => {
        jarvisUI.handle({ type: "log", speaker: "You", text });
        jarvisUI.handle({ type: "status", status: "thinking" });
        setTimeout(() => {
          jarvisUI.handle({ type: "log", speaker: "Jarvis", text: "Here's what I found for “" + text + "”." });
          jarvisUI.handle({ type: "status", status: "speaking" });
          setTimeout(() => jarvisUI.handle({ type: "status", status: "ready" }), 2500);
        }, 1400);
      },
    } };
    init();
  }
</script>
</body>
</html>
